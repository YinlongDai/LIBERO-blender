max_orientation_diff: 20.0       # mean abs difference (0-255) allowed; close-up wrist views of striped cabinets reach ~14
alignment_demos: 2               # random demos per file for the geom-id check against MuJoCo segmentation
alignment_frames_per_demo: 3
seed: 0
